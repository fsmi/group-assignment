[cost]
base = 3                      # cost of score s: base^s - 1
non_tsa_students_factor = 1.5 # weight of non-TSA students
balance_group_sizes = false   # balance fill ratios without worsening the cost

[constraints]
# TSA students get >= min students of their types in their group
min_num_students_tsa = [
  # course type + degree type
  { types = [{ course_type = "info", degree_type = "bachelor" }], min = 0 },
  { types = [{ course_type = "info", degree_type = "master" }], min = 7 },
  { types = [{ course_type = "compsci", degree_type = "master" }], min = 5 },
  { types = [{ course_type = "mathe", degree_type = "bachelor" }], min = 6 },
  { types = [{ course_type = "mathe", degree_type = "master" }], min = 7 },
  { types = [{ course_type = "cds", degree_type = "bachelor" }], min = 6 },
  { types = [{ course_type = "lehramt", degree_type = "bachelor" }], min = 3 },
  { types = [{ course_type = "lehramt", degree_type = "master" }], min = 0 },

  # degree type only
  { types = [{ degree_type = "bachelor" }], min = 0 },
  { types = [{ degree_type = "master" }], min = 0 },

  # course type only
  { types = [{ course_type = "info" }], min = 0 },
  { types = [{ course_type = "mathe" }], min = 0 },
  { types = [{ course_type = "lehramt" }], min = 0 },
]
# all students get >= min students of their types in their group
min_num_students_all = []
# min share of students of their types in each group accepting any of them
min_type_shares = [
  { types = [{ degree_type = "bachelor" }], min = 0.0 },
  { types = [{ degree_type = "master" }], min = 0.0 },
]

[constraints.group_size]
min_factor = 1.0          # scales min size from input
min_size = 0              # absolute min size
min_capacity_factor = 0.0 # min size as share of capacity
capacity_factor = 1.0     # scales capacity
